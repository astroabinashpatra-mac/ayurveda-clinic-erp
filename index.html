// Module 5: Integrated Production & Raw Material Deduction Engine
async function executeProductionBatch(recipeId, targetQty, batchNo) {
  try {
    if (!supabaseClient) throw new Error("Supabase client not initialized.");
    
    // 1. Fetch Recipe details and ingredients (BOM)
    const { data: recipe, error: recipeErr } = await supabaseClient
      .from('master_recipes')
      .select('*, recipe_ingredients(*)')
      .eq('id', recipeId)
      .single();
      
    if (recipeErr || !recipe) throw new Error("Recipe not found or failed to load ingredients.");

    const yieldMultiplier = targetQty / (recipe.standard_yield || 1);

    // 2. Fetch current Raw Materials stock levels
    const ingredientIds = recipe.recipe_ingredients.map(i => i.raw_material_id);
    const { data: rawMaterials, error: rmErr } = await supabaseClient
      .from('raw_materials')
      .select('id, name, current_stock, unit')
      .in('id', ingredientIds);

    if (rmErr) throw new Error("Failed to fetch raw material stock levels.");

    // 3. Stock Sufficiency Check
    const deductions = [];
    for (const item of recipe.recipe_ingredients) {
      const stockItem = rawMaterials.find(rm => rm.id === item.raw_material_id);
      const requiredQty = item.qty_required * yieldMultiplier;
      
      if (!stockItem || stockItem.current_stock < requiredQty) {
        alert(`Insufficient stock for ${stockItem ? stockItem.name : 'Ingredient'}. Required: ${requiredQty}, Available: ${stockItem ? stockItem.current_stock : 0}`);
        return false;
      }
      deductions.push({
        id: item.raw_material_id,
        new_stock: stockItem.current_stock - requiredQty,
        used_qty: requiredQty
      });
    }

    // 4. Execute Raw Material Stock Deductions in Supabase
    for (const d of deductions) {
      const { error: updateErr } = await supabaseClient
        .from('raw_materials')
        .update({ current_stock: d.new_stock })
        .eq('id', d.id);

      if (updateErr) throw new Error(`Failed to deduct raw material stock for ID: `);
    }

    // 5. Log Production Batch Entry
    const { data: batch, error: batchErr } = await supabaseClient
      .from('production_batches')
      .insert([{
        batch_number: batchNo || 'BATCH-' + Date.now(),
        recipe_id: recipeId,
        output_qty: targetQty,
        status: 'Completed',
        created_at: new Date().toISOString()
      }]);

    if (batchErr) throw new Error("Failed to record production batch.");

    // 6. Automatically credit finished goods to Herbal Pharmacy Stock
    const { error: pharmacyErr } = await supabaseClient.rpc('increment_pharmacy_stock', {
      medicine_name: recipe.medicine_name,
      add_qty: targetQty
    });

    alert("Production batch executed successfully! Raw materials deducted and finished stock updated.");
    if (typeof loadAushadhiNirmanData === 'function') loadAushadhiNirmanData();
    return true;

  } catch (err) {
    console.error("Production Engine Error:", err);
    alert("Production failed: " + err.message);
    return false;
  }
}



// Calculate total production cost and suggested selling price live in recipe builder
function calculateRecipeCost() {
  const rows = document.querySelectorAll('#recipe-ingredients-table tbody tr');
  let totalBatchCost = 0;

  rows.forEach(row => {
    const qtyInput = row.querySelector('.ing-qty');
    const rateInput = row.querySelector('.ing-rate');
    const costCell = row.querySelector('.ing-total-cost');
    
    const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
    const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
    const itemCost = qty * rate;
    
    totalBatchCost += itemCost;
    if (costCell) costCell.textContent = '₹' + itemCost.toFixed(2);
  });

  const yieldInput = document.getElementById('recipe-standard-yield');
  const yieldQty = parseFloat(yieldInput ? yieldInput.value : 1) || 1;
  const unitCost = totalBatchCost / yieldQty;

  // Update summary fields
  const elTotalCost = document.getElementById('calc-total-batch-cost');
  const elUnitCost = document.getElementById('calc-unit-cost');
  const elSuggestedMRP = document.getElementById('calc-suggested-mrp');

  if (elTotalCost) elTotalCost.textContent = '₹' + totalBatchCost.toFixed(2);
  if (elUnitCost) elUnitCost.textContent = '₹' + unitCost.toFixed(2);
  
  // Default 40% margin calculation for suggested MRP
  if (elSuggestedMRP) elSuggestedMRP.value = (unitCost * 1.40).toFixed(2);
}



// Global ESC key listener to close open modals across all modules
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape' || event.key === 'Esc' || event.keyCode === 27) {
    // 1. Find all visible modal overlays or dialog containers
    const modals = document.querySelectorAll('.modal, .modal-overlay, [id*="modal"], [id*="Modal"]');
    
    modals.forEach(modal => {
      const computedDisplay = window.getComputedStyle(modal).display;
      if (computedDisplay !== 'none') {
        modal.style.display = 'none';
        modal.classList.remove('active', 'show');
      }
    });

    // 2. Trigger active close button clicks if modal uses custom teardown logic
    const visibleCloseBtns = document.querySelectorAll('.modal-close, .close, [onclick*="close"]');
    visibleCloseBtns.forEach(btn => {
      if (btn.offsetParent !== null) {
        btn.click();
      }
    });
  }
});



// --- MODULE 5: RAW MATERIALS & MASTER RECIPES SYNC ENGINE ---

// 1. Fetch live raw materials from Supabase and sync into recipe dropdowns
async function syncRawMaterialsToRecipeBuilder() {
  if (!supabaseClient) return;
  const { data: materials, error } = await supabaseClient
    .from('raw_materials')
    .select('*')
    .order('name');
  
  if (error) {
    console.error("Error fetching raw materials:", error);
    return;
  }
  
  window.availableRawMaterials = materials || [];
  updateAllRecipeDropdowns();
}

// 2. Refresh dropdown options across all recipe ingredient rows
function updateAllRecipeDropdowns() {
  const dropdowns = document.querySelectorAll('.ing-material-select');
  dropdowns.forEach(select => {
    const currentVal = select.value;
    select.innerHTML = '<option value="">-- Select Raw Material --</option><td style="padding:0.4rem;">
      <select class="ing-material-select" style="width:100%; padding:0.4rem; background:var(--bg-dark); color:white; border:1px solid var(--border-dark); border-radius:4px;" onchange="onIngredientSelectChange(this)">
        <option value="">-- Select Raw Material --</option>
      </select>
    </td>
    <td style="padding:0.4rem;">
      <input type="number" step="0.01" class="ing-qty" value="${qty}" placeholder="0" style="width:100%; padding:0.4rem; background:var(--bg-dark); color:white; border:1px solid var(--border-dark); border-radius:4px;" oninput="calculateRecipeCost()">
    </td>
    <td style="padding:0.4rem;">
      <input type="number" step="0.01" class="ing-rate" value="0.00" placeholder="0.00" style="width:100%; padding:0.4rem; background:var(--bg-dark); color:white; border:1px solid var(--border-dark); border-radius:4px;" oninput="calculateRecipeCost()">
    </td>
    <td class="ing-total-cost" style="padding:0.4rem; font-weight:bold; color:var(--accent-green);">₹0.00</td>
    <td style="padding:0.4rem; text-align:center;">
      <button type="button" onclick="this.closest('tr').remove(); calculateRecipeCost();" style="background:#dc2626; color:white; border:none; padding:0.3rem 0.6rem; border-radius:4px; cursor:pointer;">✕</button>
    </td>
  `;

  tbody.appendChild(tr);
  updateAllRecipeDropdowns();
  
  if (selectedId) {
    const select = tr.querySelector('.ing-material-select');
    select.value = selectedId;
    onIngredientSelectChange(select);
  }
}

// 4. Auto-fill purchase rate when an ingredient is selected
function onIngredientSelectChange(selectElem) {
  const selectedOpt = selectElem.options[selectElem.selectedIndex];
  const rateInput = selectElem.closest('tr').querySelector('.ing-rate');
  if (selectedOpt && selectedOpt.dataset.rate && rateInput) {
    rateInput.value = parseFloat(selectedOpt.dataset.rate).toFixed(2);
  }
  calculateRecipeCost();
}

// 5. Live COGS investment & selling price calculator
function calculateRecipeCost() {
  const rows = document.querySelectorAll('#recipe-ingredients-table tbody tr');
  let totalBatchCost = 0;

  rows.forEach(row => {
    const qty = parseFloat(row.querySelector('.ing-qty')?.value) || 0;
    const rate = parseFloat(row.querySelector('.ing-rate')?.value) || 0;
    const itemCost = qty * rate;
    totalBatchCost += itemCost;
    
    const costCell = row.querySelector('.ing-total-cost');
    if (costCell) costCell.textContent = '₹' + itemCost.toFixed(2);
  });

  const yieldInput = document.getElementById('recipe-standard-yield');
  const yieldQty = parseFloat(yieldInput?.value) || 1;
  const unitCost = totalBatchCost / (yieldQty || 1);

  const elTotalCost = document.getElementById('calc-total-batch-cost');
  const elUnitCost = document.getElementById('calc-unit-cost');
  const elSuggestedMRP = document.getElementById('calc-suggested-mrp');

  if (elTotalCost) elTotalCost.textContent = '₹' + totalBatchCost.toFixed(2);
  if (elUnitCost) elUnitCost.textContent = '₹' + unitCost.toFixed(2);
  if (elSuggestedMRP && !elSuggestedMRP.dataset.userEdited) {
    elSuggestedMRP.value = (unitCost * 1.40).toFixed(2);
  }
}

// Automatically sync dropdowns when Module 5 tab opens
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(syncRawMaterialsToRecipeBuilder, 1000);
});



window.currentRecipeIngredients = window.currentRecipeIngredients || [];

function addIngredientToRecipeTable() {
  // Target raw material selector and quantity input inside the recipe modal
  const modal = document.querySelector('#modal-master-recipe, div[class*="modal"]');
  const sel = document.getElementById('recipe-rm-select') || document.querySelector('.modal select') || document.querySelector('select');
  const qtyEl = document.getElementById('recipe-rm-qty') || document.querySelector('.modal input[type="number"]') || document.querySelector('input[type="number"]');

  if (!sel || !sel.value) {
    alert("Please select a raw material from the dropdown.");
    return;
  }

  const qty = parseFloat(qtyEl ? qtyEl.value : 0);
  if (!qty || qty <= 0) {
    alert("Please enter a valid quantity per unit.");
    return;
  }

  const selectedOpt = sel.options[sel.selectedIndex];
  const matName = selectedOpt.textContent.trim();
  const matId = sel.value;
  const rate = parseFloat(selectedOpt.dataset.rate || 0);

  // Check if material already exists in list; if so, aggregate quantity
  const existingIdx = window.currentRecipeIngredients.findIndex(item => item.id === matId);
  if (existingIdx !== -1) {
    window.currentRecipeIngredients[existingIdx].qty += qty;
  } else {
    window.currentRecipeIngredients.push({
      id: matId,
      name: matName,
      qty: qty,
      rate: rate
    });
  }

  renderRecipeIngredientsTable();

  // Reset quantity input field
  if (qtyEl) qtyEl.value = '';
}

function renderRecipeIngredientsTable() {
  // Find tbody inside recipe modal
  const modal = document.querySelector('#modal-master-recipe') || document;
  const tbody = modal.querySelector('tbody') || document.querySelector('#recipe-ingredients-table tbody');
  
  if (!tbody) return;

  if (!window.currentRecipeIngredients || window.currentRecipeIngredients.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted); padding:1rem;">No ingredients added.</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  window.currentRecipeIngredients.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid var(--border-dark)';
    tr.innerHTML = `
      <td style="padding: 0.6rem; color: white;"></td>
      <td style="padding: 0.6rem; color: white;"></td>
      <td style="padding: 0.6rem; text-align: center;">
        <button type="button" onclick="removeRecipeIngredient(${index})" style="background:#dc2626; color:white; border:none; padding:0.25rem 0.5rem; border-radius:4px; cursor:pointer;">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  if (typeof calculateRecipeCost === 'function') calculateRecipeCost();
}

function removeRecipeIngredient(index) {
  window.currentRecipeIngredients.splice(index, 1);
  renderRecipeIngredientsTable();
}

<script>
// Universal Supabase Client & ERP Auto-Sync Bridge
(function() {
  function getClient() {
    try { if (typeof supabaseClient !== 'undefined' && supabaseClient && supabaseClient.from) return supabaseClient; } catch(e){}
    try { if (typeof sbClient !== 'undefined' && sbClient && sbClient.from) return sbClient; } catch(e){}
    if (window.supabaseClient && window.supabaseClient.from) return window.supabaseClient;
    if (window.sbClient && window.sbClient.from) return window.sbClient;
    return null;
  }

  let attempts = 0;
  const bootTimer = setInterval(function() {
    const client = getClient();
    if (client) {
      window.supabaseClient = client;
      window.sbClient = client;
      clearInterval(bootTimer);
      
      // Trigger data refresh across all core ERP modules
      if (typeof loadDashboardStats === 'function') loadDashboardStats();
      if (typeof loadPatients === 'function') loadPatients();
      if (typeof renderPatientTable === 'function') renderPatientTable();
      if (typeof loadAushadhiNirmanData === 'function') loadAushadhiNirmanData();
      if (typeof loadPharmacyStock === 'function') loadPharmacyStock();
      if (typeof loadAccounts === 'function') loadAccounts();
    }
    attempts++;
    if (attempts > 40) clearInterval(bootTimer);
  }, 200);
})();
</script>

window.applyAccountsFilters = function() {
  const search = (document.getElementById('acc-filter-search')?.value || '').toLowerCase();
  const typeFilter = document.getElementById('acc-filter-type')?.value || '';
  const vendorFilter = document.getElementById('acc-filter-vendor')?.value || '';
  const periodFilter = document.getElementById('acc-filter-period')?.value || 'all';
  const now = new Date();
  
  window.accState.filteredData = window.accState.rawData.filter(item => {
    const titleText = (item.title || item.vendor_name || '').toLowerCase();
    const catText = (item.category || '').toLowerCase();
    if (search && !titleText.includes(search) && !catText.includes(search)) return false;

    const itemType = (item.type || 'Expense').toLowerCase();
    if (typeFilter === 'debit' && !itemType.includes('expense') && !itemType.includes('debit')) return false;
    if (typeFilter === 'credit' && !itemType.includes('income') && !itemType.includes('credit') && !itemType.includes('payment')) return false;

    if (vendorFilter && titleText !== vendorFilter.toLowerCase()) return false;

    if (periodFilter !== 'all') {
      const itemDate = new Date(item.created_at || item.date || Date.now());
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      if (periodFilter === 'today' && itemDate < todayStart) return false;
      if (periodFilter === 'yesterday') {
        const yestStart = new Date(todayStart);
        yestStart.setDate(yestStart.getDate() - 1);
        if (itemDate < yestStart || itemDate >= todayStart) return false;
      }
      if (periodFilter === 'this_week') {
        const weekStart = new Date(todayStart);
        weekStart.setDate(weekStart.getDate() - weekStart.getDay());
        if (itemDate < weekStart) return false;
      }
      if (periodFilter === 'last_month') {
        const lmStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const lmEnd = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
        if (itemDate < lmStart || itemDate > lmEnd) return false;
      }
      if (periodFilter === '3_months') {
        const m3 = new Date(todayStart);
        m3.setMonth(m3.getMonth() - 3);
        if (itemDate < m3) return false;
      }
      if (periodFilter === '6_months') {
        const m6 = new Date(todayStart);
        m6.setMonth(m6.getMonth() - 6);
        if (itemDate < m6) return false;
      }
      if (periodFilter === 'current_fy') {
        const fyStartYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1;
        const fyStart = new Date(fyStartYear, 3, 1);
        const fyEnd = new Date(fyStartYear + 1, 2, 31, 23, 59, 59);
        if (itemDate < fyStart || itemDate > fyEnd) return false;
      }
      if (periodFilter === 'last_fy') {
        const fyStartYear = (now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1) - 1;
        const fyStart = new Date(fyStartYear, 3, 1);
        const fyEnd = new Date(fyStartYear + 1, 2, 31, 23, 59, 59);
        if (itemDate < fyStart || itemDate > fyEnd) return false;
      }
    }
    return true;
  });

  window.renderAccountsTable();
};
